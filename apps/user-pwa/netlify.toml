# Netlify build config for the user-pwa monorepo package.
# Site: mistr-waan.netlify.app

[build]
  command = "pnpm --filter user-pwa run build"
  publish = "apps/user-pwa/.next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  # Skip prompting when multiple workspace Next.js apps are detected.
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Explicit plugin declaration — same fix as the ops app. Without this,
# Netlify auto-detection leaves framework="unknown" / plugin_state="none"
# and deploys every SSR route as a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Legacy /ops -> waan-ops.netlify.app redirect removed in Week 1.
# Ops dashboard now lives at /ops/* inside this same app. A future Week 2+
# DNS change can split it onto ops.autogtg.com as its own site if desired.
